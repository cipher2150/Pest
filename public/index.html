<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pest — keepalive pinger</title>
<style>
  :root {
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #2b2320;
    background: linear-gradient(180deg, #cdeeff 0%, #eef7ff 28%, #fdf6e6 62%, #eaf7e3 100%);
    overflow-x: hidden;
  }

  /* ---- flying butterflies (decorative, behind content) ---- */
  .sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .butterfly {
    position: absolute;
    left: 0;
    top: var(--top);
    animation: fly var(--dur) linear var(--delay) infinite;
    animation-direction: var(--dir, normal);
    filter: drop-shadow(0 6px 10px rgba(40, 30, 10, 0.18));
  }
  .butterfly img {
    display: block;
    width: var(--size);
    height: auto;
    transform: scaleX(var(--flip, 1));
    animation: flap var(--flap-dur) ease-in-out infinite alternate;
    transform-origin: 50% 50%;
  }
  @keyframes fly {
    0%   { transform: translate(-15vw, 0)      rotate(-4deg); }
    22%  { transform: translate(20vw, -6vh)    rotate(5deg); }
    48%  { transform: translate(55vw, 4vh)     rotate(-6deg); }
    74%  { transform: translate(88vw, -5vh)    rotate(4deg); }
    100% { transform: translate(118vw, 0)      rotate(-4deg); }
  }
  @keyframes flap {
    from { transform: scaleX(var(--flip, 1)) scaleY(1); }
    to   { transform: scaleX(var(--flip, 1)) scaleY(0.72); }
  }
  @media (prefers-reduced-motion: reduce) {
    .butterfly, .butterfly img { animation: none; }
  }

  /* ---- actual app ---- */
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 6vh auto 4rem;
    padding: 0 1.25rem;
  }
  .card {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 20px;
    padding: 2rem 1.75rem;
    box-shadow: 0 20px 50px rgba(60, 50, 20, 0.12);
  }
  h1 {
    margin: 0 0 0.3rem;
    font-size: 1.9rem;
    letter-spacing: -0.02px;
  }
  h1 .dot { color: #e8742c; }
  .tagline {
    margin: 0 0 1.5rem;
    color: #6b5f52;
    font-size: 1rem;
    line-height: 1.5;
  }
  form { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
  input[type=url] {
    flex: 1;
    padding: 0.7rem 0.9rem;
    font-size: 1rem;
    border: 1px solid #d8cdbd;
    border-radius: 10px;
    background: #fffdfa;
  }
  input[type=url]:focus { outline: 2px solid #e8742c; outline-offset: 1px; }
  button {
    padding: 0.7rem 1.2rem;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: #e8742c;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button:hover { background: #d4631f; }
  #self { color: #8a7c6c; font-size: 0.85rem; margin: 0 0 1.25rem; }
  #error { color: #c0392b; min-height: 1.2em; font-size: 0.9rem; margin: 0 0 0.5rem; }

  ul { list-style: none; padding: 0; margin: 0.5rem 0 0; }
  li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.75rem;
    padding: 0.75rem 0;
    border-bottom: 1px solid rgba(0,0,0,0.07);
  }
  li:last-child { border-bottom: none; }
  li strong { word-break: break-all; font-size: 0.95rem; }
  .meta { color: #8a7c6c; font-size: 0.8rem; white-space: nowrap; }
  .status-ok { color: #2f8a4b; font-weight: 600; }
  .status-bad { color: #c0392b; font-weight: 600; }
</style>
</head>
<body>

<div class="sky" aria-hidden="true" id="sky"></div>

<div class="wrap">
  <div class="card">
    <h1>pest<span class="dot">.</span></h1>
    <p class="tagline">Give us a link and we'll keep it fluttering — pinged every 10 minutes so your free-tier app never falls asleep.</p>
    <p id="self"></p>
    <form id="add-form">
      <input type="url" id="url-input" placeholder="https://your-app.onrender.com" required>
      <button type="submit">Add link</button>
    </form>
    <p id="error"></p>
    <ul id="link-list"></ul>
  </div>
</div>

<script>
// --- decorative butterflies ---
const BUTTERFLY_COUNT = 14;
const sky = document.getElementById('sky');
for (let i = 0; i < BUTTERFLY_COUNT; i++) {
  const b = document.createElement('div');
  b.className = 'butterfly';
  const reverse = Math.random() < 0.5;
  b.style.setProperty('--top', `${4 + Math.random() * 78}vh`);
  b.style.setProperty('--dur', `${20 + Math.random() * 18}s`);
  b.style.setProperty('--delay', `${-Math.random() * 30}s`);
  b.style.setProperty('--size', `${34 + Math.random() * 30}px`);
  b.style.setProperty('--flap-dur', `${0.25 + Math.random() * 0.25}s`);
  if (reverse) {
    b.style.setProperty('--dir', 'reverse');
    b.style.setProperty('--flip', '-1');
  }
  const img = document.createElement('img');
  img.src = `butterflies/b${i % BUTTERFLY_COUNT}.png`;
  img.alt = '';
  b.appendChild(img);
  sky.appendChild(b);
}

// --- link list (app logic) ---
async function loadLinks() {
  const res = await fetch('/api/links');
  const data = await res.json();
  document.getElementById('self').textContent = data.selfUrl
    ? `This service pings itself automatically at ${data.selfUrl}`
    : '';
  const list = document.getElementById('link-list');
  list.innerHTML = '';
  for (const link of data.links) {
    const li = document.createElement('li');

    const left = document.createElement('div');
    const strong = document.createElement('strong');
    strong.textContent = link.url; // textContent, not innerHTML: link.url is user-submitted
    left.appendChild(strong);
    left.appendChild(document.createElement('br'));
    const added = document.createElement('span');
    added.className = 'meta';
    added.textContent = `added ${new Date(link.addedAt).toLocaleString()}`;
    left.appendChild(added);
    li.appendChild(left);

    const statusSpan = document.createElement('span');
    statusSpan.className = link.lastStatus === 'ok' ? 'status-ok' : (link.lastStatus ? 'status-bad' : 'meta');
    statusSpan.textContent = link.lastStatus ? `${link.lastStatus}` : 'not pinged yet';
    if (link.lastLatencyMs != null) statusSpan.textContent += ` · ${link.lastLatencyMs}ms`;
    li.appendChild(statusSpan);

    list.appendChild(li);
  }
}

document.getElementById('add-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('url-input');
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';
  const res = await fetch('/api/links', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url: input.value.trim() }),
  });
  if (res.ok) {
    input.value = '';
    loadLinks();
  } else {
    const data = await res.json().catch(() => ({}));
    errorEl.textContent = data.error || 'failed to add link';
  }
});

loadLinks();
setInterval(loadLinks, 30000);
</script>
</body>
</html>
